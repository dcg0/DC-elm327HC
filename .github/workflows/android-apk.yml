name: Build Android APK

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      PATH: /usr/local/lib/android/sdk/platform-tools:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android components
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME" -type f -name sdkmanager -perm -111 | head -n 1)
          if [ -z "$SDKMANAGER" ]; then echo "sdkmanager not found under $ANDROID_HOME"; find /usr/local/lib/android /opt/android-sdk /opt/hostedtoolcache -type f -name sdkmanager 2>/dev/null | head -n 20; exit 1; fi
          SDK_BIN=$(dirname "$SDKMANAGER")
          echo "$SDK_BIN" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DC-ELM327-debuggable-review-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
